name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved to
# point at different code after review. Dependabot reads the trailing
# comment and keeps both the SHA and the version in step.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pit shells out to git, docker and gh; every platform is a
        # target, so every one is built and tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Git's bash on Windows, so that one script serves all three.
    defaults:
      run:
        shell: bash
    steps:
      # The tests make repositories of their own and compare what is
      # checked out byte for byte; Git for Windows would turn their LF
      # into CRLF on the way.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Both runners come with Chrome; the tests that load pages in it
      # must run here, not be skipped as on a machine without one.
      - name: Test
        run: go test -race ./...
        env:
          PIT_REQUIRE_BROWSER: "1"

      # The suite must not need the network: a test that reaches GitHub
      # fails on a plane, behind a proxy, and whenever the service is
      # having a bad day. Running it again with git restricted to local
      # paths turns that from an intention into a check.
      - name: Test without network access
        run: make test-offline

      - name: Build
        run: go build ./...

  # The processes of a project whose tools come from a flake, with nix
  # itself rather than the stand-in the other jobs use.
  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test with nix
        run: go test -run 'RealFlake' ./internal/sandbox
        env:
          PIT_REQUIRE_NIX: "1"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      # The workflows here and the one shipped in examples/ for other
      # people to copy. A template that does not parse would be found
      # by whoever trusted it.
      - name: Check the workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml examples/github-actions/*.yml
